name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  playbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests and content
        run: python tests/validate.py
      - name: Check update script syntax
        run: sh -n bin/update-playbook.sh
